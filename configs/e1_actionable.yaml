# E1 actionable-feedback experiment configuration
# Identical to e0_pilot.yaml except the mode list: the two new arms must run
# under exactly the same budget/model/temperature as the E0 arms they are
# paired against (baselines are reused from runs/E0v2s5).

experiment: E1

llm:
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
  temperature: 0.2
  max_tokens: 4096

budget:
  max_iterations: 5
  max_tokens_per_instance: 50000
  feedback_max_chars: 6000

sandbox:
  backend: subprocess
  timeout_sec: 20
  docker_image: python:3.11-slim

tasks:
  selfbuilt_limit: 20
  swe_subset_path: data/swe_pilot_subset.jsonl

modes: [repair_structured, repair_contrast]

output_dir: runs/E1
