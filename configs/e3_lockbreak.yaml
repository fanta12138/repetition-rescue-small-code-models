# E3 lock-breaking experiment configuration.
# Identical to e0_pilot.yaml except modes/output_dir: intervention arms must
# run under the same loop/budget/temperature as repair_structured.

experiment: E3

llm:
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
  temperature: 0.2
  max_tokens: 4096

budget:
  max_iterations: 5
  max_tokens_per_instance: 50000
  feedback_max_chars: 6000

sandbox:
  backend: subprocess
  timeout_sec: 20
  docker_image: python:3.11-slim

tasks:
  selfbuilt_limit: 20
  swe_subset_path: data/swe_pilot_subset.jsonl

# E3 arms: trigger-based lock-breaking interventions on the structured base.
modes: [repair_diverse, repair_tempbump]

output_dir: runs/E3
